name: CI

on:
  push:
    branches:
      - main
      - preview_b
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Enforce npm-only lockfiles
        run: test ! -f bun.lockb

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm --prefix server ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test client
        run: npm run test:run

      - name: Build client
        run: npm run build

      - name: Test server
        run: npm --prefix server run test

      - name: Build server
        run: npm --prefix server run build

  edge-functions:
    # Deno tests for the delete-account edge function (DEBT-086).
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test delete-account function
        run: npx -y deno@2 test --no-config supabase/functions/delete-account/

  e2e:
    # Playwright lifter loop (guest, chromium only). Roadmap 3.5.
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright (chromium)
        run: npx playwright test --project=chromium --trace off

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
