name: CI

on:
  push:
    branches:
      - main
      - preview_b
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Enforce npm-only lockfiles
        run: test ! -f bun.lockb

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm --prefix server ci

      - name: Lint
        run: npm run lint

      - name: Test client
        run: npm run test:run

      - name: Build client
        run: npm run build

      - name: Test server
        run: npm --prefix server run test

      - name: Build server
        run: npm --prefix server run build
