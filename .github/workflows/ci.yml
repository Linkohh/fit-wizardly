name: CI

on:
  push:
    branches:
      - main
      - preview_b
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Enforce npm-only lockfiles
        run: test ! -f bun.lockb

      - name: Install root dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test client
        run: npm run test:run

      - name: Build client
        run: npm run build

  edge-functions:
    # Deno tests for the delete-account edge function (DEBT-086).
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test delete-account function
        run: npx -y deno@2 test --no-config supabase/functions/delete-account/

  e2e:
    # Playwright lifter loop (guest, chromium only). Roadmap 3.5.
    # Pinned: Playwright 1.59 has no chromium build for ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    needs: test
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright (chromium)
        run: npx playwright test --project=chromium --trace off

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  android:
    # Android release bundle (roadmap 4.5, Lane H Day 7). Runs on pushes to
    # main and preview_b, and on PRs from lane-h/* branches (the native lane),
    # so other lanes' PRs don't spend minutes on it.
    # Signed only when the ANDROID_KEYSTORE_* secrets exist; otherwise the
    # .aab is unsigned (fine for CI, not uploadable to Play). See
    # docs/RELEASE_MOBILE.md.
    if: github.event_name == 'push' || startsWith(github.head_ref, 'lane-h/')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install root dependencies
        run: npm ci

      - name: Build web app
        # Vite bakes these into the bundle, so they must be set here, not at
        # signing time. They are public values (VITE_*), kept as repository
        # variables. Without them the bundle compiles but sign-in is off and
        # native /api calls have no origin: fine for CI, not for Play.
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_PUBLIC_APP_ORIGIN: ${{ vars.VITE_PUBLIC_APP_ORIGIN }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ] || [ -z "$VITE_PUBLIC_APP_ORIGIN" ]; then
            echo "::warning title=Android bundle not release-ready::VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY or VITE_PUBLIC_APP_ORIGIN is not set as a repository variable. Don't upload this .aab to Play. See docs/RELEASE_MOBILE.md."
          fi
          npm run build

      - name: Sync Capacitor (Android)
        run: npx cap sync android

      - name: Write signing config (if secrets are set)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::notice title=Unsigned Android build::ANDROID_KEYSTORE_* secrets are not set, so the .aab is unsigned. See docs/RELEASE_MOBILE.md."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/fitwizard-release.jks
          {
            echo "storeFile=fitwizard-release.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/keystore.properties

      - name: Build release bundle
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Remove signing files
        if: always()
        run: rm -f android/keystore.properties android/fitwizard-release.jks

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
